<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFH Admin</title><link rel="stylesheet" href="style.css"><script src="config.js"></script></head><body><header class="topbar"><a class="brand" href="index.html"><img src="logo.png"><span><b>Arif Fashion House</b><small>Admin Panel</small></span></a><a class="admin-link" href="index.html">Store</a></header><main><div id="login" class="box"><h2>🔐 Admin Login</h2><input id="password" type="password" placeholder="Admin Password"><button class="primary full" onclick="login()">Login</button><p id="msg"></p></div><div id="panel" class="hidden"><div class="box"><h2>⚙️ Website Settings</h2><input id="brand" placeholder="Brand name"><input id="hero" placeholder="Hero title"><input id="heroSub" placeholder="Hero subtitle"><input id="shipping" type="number" placeholder="Shipping charge"><input id="facebook" placeholder="Facebook URL"><input id="youtube" placeholder="YouTube URL"><input id="bkash" placeholder="bKash number"><input id="nagad" placeholder="Nagad number"><input id="rocket" placeholder="Rocket number"><textarea id="warning" placeholder="Checkout warning"></textarea><label><input id="cod" type="checkbox"> COD enabled</label><label><input id="advance" type="checkbox"> Advance enabled</label><button class="primary full" onclick="saveSettings()">Save Settings</button></div><div class="box"><h2>➕ Product</h2><input id="pid" type="hidden"><input id="name" placeholder="Product name"><select id="cat"><option value="men">Men</option><option value="women">Women</option></select><input id="image" placeholder="Main image URL"><input id="images" placeholder="More image URLs, comma separated"><input id="price" type="number" placeholder="Selling price"><input id="oldPrice" type="number" placeholder="Old price"><input id="colors" placeholder="Colors, comma separated; leave empty if none"><input id="sizes" placeholder="Sizes, comma separated; leave empty if none"><textarea id="desc" placeholder="Description"></textarea><button class="primary full" onclick="saveProduct()">Save Product</button></div><div class="box"><h2>🛍️ Products</h2><div id="plist" class="grid"></div></div><div class="box"><h2>📦 Orders</h2><div id="orders"></div></div></div></main><script src="admin.js"></script></body></html>
